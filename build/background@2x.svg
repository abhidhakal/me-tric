<svg width="1080" height="760" viewBox="0 0 1080 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="50%" stop-color="#0f0f13" />
      <stop offset="100%" stop-color="#09090c" />
    </linearGradient>

    <!-- Ambient Top Glow -->
    <radialGradient id="topGlow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </radialGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.7)" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Arrowhead Marker -->
    <marker id="arrowhead" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto">
      <polygon points="0 0, 16 8, 0 16" fill="#ffffff" />
    </marker>

    <!-- Drop Shadow for Pedestals -->
    <filter id="pedestalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rect -->
  <rect width="1080" height="760" fill="url(#bgGrad)" />
  <rect width="1080" height="760" fill="url(#topGlow)" />

  <!-- Subtle Ambient Border -->
  <rect x="2" y="2" width="1076" height="756" rx="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Top Branding -->
  <g text-anchor="middle">
    <text x="540" y="124" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="-0.02em">MeTric</text>
    <text x="540" y="164" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="22" font-weight="500" fill="rgba(255, 255, 255, 0.45)" letter-spacing="0.01em">Personal Life &amp; Metric Tracker</text>
  </g>

  <!-- App Pedestal (Left: x=140, y=190) -->
  <g transform="translate(280, 380)">
    <ellipse cx="0" cy="96" rx="92" ry="28" fill="rgba(0, 0, 0, 0.45)" filter="url(#pedestalGlow)" />
    <rect x="-84" y="-84" width="168" height="168" rx="36" fill="rgba(255, 255, 255, 0.025)" stroke="rgba(255, 255, 255, 0.08)" stroke-dasharray="8 8" stroke-width="2" />
  </g>

  <!-- Applications Pedestal (Right: x=400, y=190) -->
  <g transform="translate(800, 380)">
    <ellipse cx="0" cy="96" rx="92" ry="28" fill="rgba(0, 0, 0, 0.45)" filter="url(#pedestalGlow)" />
    <rect x="-84" y="-84" width="168" height="168" rx="36" fill="rgba(255, 255, 255, 0.025)" stroke="rgba(255, 255, 255, 0.08)" stroke-dasharray="8 8" stroke-width="2" />
  </g>

  <!-- Arrow & Label (Center: between x=205 and x=335) -->
  <g transform="translate(0, 0)">
    <!-- Label above arrow -->
    <text x="540" y="352" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="20" font-weight="600" fill="rgba(255, 255, 255, 0.6)" letter-spacing="0.08em" text-transform="uppercase">
      DRAG TO INSTALL
    </text>

    <!-- Sleek Arrow Line with Head -->
    <line x1="424" y1="380" x2="636" y2="380" stroke="url(#arrowGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 8" />
    <polygon points="636 370, 656 380, 636 390" fill="#ffffff" />
  </g>

  <!-- Bottom Tip -->
  <text x="540" y="660" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="21" font-weight="400" fill="rgba(255, 255, 255, 0.35)">
    Drag the MeTric icon into your Applications folder to get started
  </text>
</svg>